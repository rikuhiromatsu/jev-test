[project]
name = "triage"
version = "0.1.0"
description = "Jev (TypeSafe System One) で案件相談の問い合わせを確度・優先度で仕分ける"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk>=0.1",
    "rich>=13.0",
]

[project.scripts]
triage = "triage.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]
